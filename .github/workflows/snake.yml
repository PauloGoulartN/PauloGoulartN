name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#a855f7&color_dots=#1a1b26,#2d3f76,#565f89,#7aa2f7,#bb9af7
            dist/github-contribution-grid-snake-dark.svg?color_snake=#a855f7&color_dots=#1a1b26,#2d3f76,#565f89,#7aa2f7,#bb9af7
            
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
